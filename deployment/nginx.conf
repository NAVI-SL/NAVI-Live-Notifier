user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
# Standard error logs can include OAuth query strings or callback capability paths.
# Keep request errors out of logs; status-only access records retain safe diagnostics.
error_log /dev/null crit;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  log_format safe escape=json '{"service":"edge","method":"$request_method","status":$status,"duration":$request_time}';
  access_log /dev/stdout safe;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
  limit_req_zone $binary_remote_addr zone=hooks:10m rate=10r/s;
  limit_req_zone $server_name zone=hook_total:1m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=site:10m rate=30r/s;
  limit_req_status 429;
  client_max_body_size 64k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 30s;
  keepalive_timeout 30s;
  proxy_connect_timeout 5s;
  proxy_read_timeout 45s;
  proxy_send_timeout 15s;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header Forwarded '';
  proxy_set_header Connection '';
  server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /health { return 200 'ok'; }
    location / { return 404; }
  }
  server {
    listen 80;
    # No Host-derived redirect: owner must select a canonical HTTPS origin first.
    return 404;
  }
  server {
    listen 443 ssl;
    server_name localhost;
    # Replace both localhost occurrences with the approved hostname before public deployment.
    if ($host != localhost) { return 421; }
    ssl_certificate /etc/navi/tls/fullchain.pem;
    ssl_certificate_key /etc/navi/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Enable HSTS on the approved public hostname after HTTPS verification.
    # Do not set it for localhost: browsers would also upgrade existing HTTP development ports.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
    location /internal { return 404; }
    location = /webhooks/kick {
      limit_req zone=hooks burst=20 nodelay;
      limit_req zone=hook_total burst=40 nodelay;
      proxy_pass http://127.0.0.1:4100;
    }
    location ~ "^/webhooks/youtube/UC[A-Za-z0-9_-]{22}/[a-f0-9]{64}$" {
      limit_req zone=hooks burst=20 nodelay;
      limit_req zone=hook_total burst=40 nodelay;
      proxy_pass http://127.0.0.1:4100;
    }
    location /webhooks { return 404; }
    location /api/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://127.0.0.1:3000;
    }
    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://127.0.0.1:3000;
    }
    location / {
      limit_req zone=site burst=60 nodelay;
      # Includes native install form POSTs under the dashboard.
      proxy_pass http://127.0.0.1:3000;
    }
  }
}
